name: crediplus_authenticator
description: "CrediPlus Authenticator in Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Escáner QR para Android e iOS
  mobile_scanner: ^7.1.3

  # Generación de códigos TOTP
  otp: ^3.1.4

  # Almacenamiento seguro de secretos TOTP
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F4C81"
  adaptive_icon_foreground: "assets/icon/app_icon.png"